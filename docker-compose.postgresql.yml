services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=comptage
      - POSTGRES_PASSWORD=comptage_password
      - POSTGRES_DB=comptage_heures
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comptage -d comptage_heures']
      interval: 10s
      timeout: 5s
      retries: 5

  site-comptage-heure:
    build:
      context: .
      args:
        - DATABASE_PROVIDER=postgresql
        - DATABASE_URL=postgresql://comptage:comptage_password@postgres:5432/comptage_heures
    ports:
      - '3000:3000'
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NEXTAUTH_SECRET=your_secret_key
      - NEXTAUTH_URL=http://localhost:3000
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://comptage:comptage_password@postgres:5432/comptage_heures
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
